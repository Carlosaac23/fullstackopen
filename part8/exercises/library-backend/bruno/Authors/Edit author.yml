info:
  name: Edit author
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    query: |-
      mutation EditAuthor($name: String!, $setBornTo: Int!) {
        editAuthor(name: $name, setBornTo: $setBornTo) {
          id
          name
          born
          bookCount
        }
      }
    variables: |-
      {
        "name": "HP Lovecraft",
        "setBornTo": 1890
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Get books by author
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}"
  body:
    query: |-
      query AllBooks($author: String) {
        allBooks(author: $author) {
          title
          author {
            name
          }
          published
          genres
        }
      }
    variables: |-
      {
        "author": "Robert Martin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

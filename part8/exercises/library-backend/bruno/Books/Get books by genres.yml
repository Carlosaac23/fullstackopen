info:
  name: Get books by genres
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}"
  body:
    query: |-
      query AllBooks($genre: String) {
        allBooks(genre: $genre) {
          title
          author {
            name
          }
          published
          genres
        }
      }
    variables: |-
      {
        "genre": "horror"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Get persons
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}"
  body:
    query: |
      query Persons {
        allPersons {
          id
          name
          phone
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

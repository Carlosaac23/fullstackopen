info:
  name: Find person
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}"
  body:
    query: |-
      query FindPerson($name: String!) {
        findPerson(name: $name) {
          friendOf {
            username
          }
        }
      }
    variables: |-
      {
        "name": "Carlos Acosta"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

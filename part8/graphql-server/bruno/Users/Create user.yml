info:
  name: Create user
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{BASE_URL}}"
  body:
    query: |-
      mutation CreateUser($username: String!) {
        createUser(username: $username) {
          id
          username
        }
      }
    variables: |-
      {
        "username": "carlosaac23"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Me
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    query: |-
      query {
        me {
          id
          username
          friends {
            name
            phone
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

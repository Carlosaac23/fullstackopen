info:
  name: Create comment to blog
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/api/blogs/{{blogId}}/comments"
  body:
    type: json
    data: |-
      {
        "comment": "{{$randomPhrase}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

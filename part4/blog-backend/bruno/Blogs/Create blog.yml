info:
  name: Create blog
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/blogs"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "title": "{{$randomPhrase}}",
        "author": "{{authName}}",
        "url": "{{$randomUrl}}",
        "likes": {{$randomInt}}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.id) {
          bru.setVar('blogId', res.body.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

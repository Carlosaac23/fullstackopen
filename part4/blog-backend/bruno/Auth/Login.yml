info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/login"
  body:
    type: json
    data: |-
      {
        "username": "carlosaac23",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) {
          bru.setVar('authToken', res.body.token)
          bru.setVar('authName', res.body.name)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
